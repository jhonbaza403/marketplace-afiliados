<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Marketplace de Afiliados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Marketplace de Ofertas</h1>
    </header>

    <main id="productos-container">
        <!-- Producto 1: Amazon -->
        <div class="producto">
            <h3>Gadget Tech 2026</h3>
            <p>Descripción del producto increíble de tecnología.</p>
            <button class="btn-afiliado" data-url="https://amzn.to/4bJJq22">Comprar en Amazon</button>
        </div>

        <!-- Producto 2: Shein -->
        <div class="producto">
            <h3>Moda Tendencia</h3>
            <p>Lo último en moda a un precio espectacular.</p>
            <button class="btn-afiliado" data-url="https://onelink.shein.com/44/5wyleaujbj2iI">Comprar en Shein</button>
        </div>

        <!-- Producto 3: AliExpress -->
        <div class="producto">
            <h3>Oferta AliExpress</h3>
            <p>Calidad garantizada para tu hogar.</p>
            <button class="btn-afiliado" data-url="https://s.click.aliexpress.com/e/_c33p0iwF">Comprar en AliExpress</button>
        </div>
    </main><!-- Producto 4: Alibaba -->
        <div class="producto">
            <h3>Oferta Alibaba</h3>
            <p>Encuentra productos al por mayor y proveedores directos.</p>
            <button class="btn-afiliado" data-url="https://offer.alibaba.com/cps/u48rr634?bm=cps&src=saf">Comprar en Alibaba</button>
        </div>

    <script src="script.js"></script>
</body>
</html>
