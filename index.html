<!-- Botón en la Cabecera para Crear Cuenta -->
  <!-- Agregar dentro del <header class="hero-banner"> en la parte superior -->
  <div class="user-access">
    <button id="open-auth-btn" class="auth-btn">👤 Crear Cuenta / CrediOfertas</button>
  </div>

  <!-- Modal de Registro y Verificación de Identidad (KYC) -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      
      <h2>🔐 Registro y Solicitud de Crédito</h2>
      <p class="modal-sub">Completa tu perfil para acceder a financiamiento inmediato y ofertas exclusivas.</p>

      <form id="kyc-form">
        <!-- Datos Personales -->
        <div class="form-group">
          <label for="user-fullname">Nombre y Apellido Complto</label>
          <input type="text" id="user-fullname" required placeholder="Ej: Juan Pérez">
        </div>

        <div class="form-group">
          <label for="user-email">Correo Electrónico</label>
          <input type="email" id="user-email" required placeholder="tuemail@ejemplo.com">
        </div>

        <div class="form-group">
          <label for="user-phone">Teléfono / WhatsApp</label>
          <input type="tel" id="user-phone" required placeholder="+58 412 000 0000">
        </div>

        <!-- Carga de Documentos (Estilo Cashea / Krediya) -->
        <div class="form-group">
          <label for="user-id-doc">🪪 Foto de tu Cédula o Documento de Identidad</label>
          <input type="file" id="user-id-doc" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="user-selfie">📸 Fotografía Frontal (Selfie de Confirmación)</label>
          <input type="file" id="user-selfie" accept="image/*" required>
        </div>

        <!-- Opción de Crédito -->
        <div class="form-group checkbox-group">
          <input type="checkbox" id="request-credit" checked>
          <label for="request-credit">Solicitar evaluación para cupo de financiamiento tipo Cashea</label>
        </div>

        <button type="submit" class="submit-btn">Enviar y Verificar Cuenta</button>
      </form>
    </div>
  </div>
