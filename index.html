<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Marketplace de Afiliados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Marketplace de Ofertas</h1>
    </header>

    <main id="productos-container">
        <!-- Producto 1: Amazon -->
        <div class="producto">
            <h3>Gadget Tech 2026</h3>
            <p>Descripción del producto increíble de tecnología.</p>
            <button class="btn-afiliado" data-url="TU_ENLACE_AMAZON_AQUI">Comprar en Amazon</button>
        </div>

        <!-- Producto 2: Shein -->
        <div class="producto">
            <h3>Moda Tendencia</h3>
            <p>Lo último en moda a un precio espectacular.</p>
            <button class="btn-afiliado" data-url="TU_ENLACE_SHEIN_AQUI">Comprar en Shein</button>
        </div>

        <!-- Producto 3: AliExpress -->
        <div class="producto">
            <h3>Oferta AliExpress</h3>
            <p>Calidad garantizada para tu hogar.</p>
            <button class="btn-afiliado" data-url="TU_ENLACE_ALIEXPRESS_AQUI">Comprar en AliExpress</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
